
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Default Title{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            --portal-navy: #23395B;
            --portal-navy-dark: #182A43;
            --portal-gold: #C5A45B;
            --portal-background: #F7F6F2;
            --portal-text: #343A40;
            --portal-muted: #6C757D;
        }
        body {
            color: var(--portal-text);
            background-color: var(--portal-background);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }
        .navbar {
            background-color: var(--portal-navy) !important;
        }
        .navbar-brand {
            color: #FFFFFF !important;
            font-weight: 600;
        }
        .nav-link {
            color: #E5E7EB !important;
        }
        .nav-link:hover {
            color: var(--portal-gold) !important;
        }
        h1, h2, h3, h4, h5 {
            color: var(--portal-navy);
        }
        .btn-primary {
            background-color: var(--portal-navy);
            border-color: var(--portal-navy);
            border-radius: 5px;
            padding: 9px 15px;
        }
        .btn-primary:hover {
            background-color: var(--portal-navy-dark);
            border-color: var(--portal-navy-dark);
        }
        .btn-outline-primary {
            color: var(--portal-navy);
            border-color: var(--portal-navy);
            border-radius: 5px;
            padding: 9px 15px;
        }
        .btn-outline-primary:hover {
            background-color: var(--portal-navy);
            border-color: var(--portal-navy);
            color: #FFFFFF;
        }
        .card {
            background-color: #FFFFFF;
            border: 1px solid #E2E2E2;
            border-radius: 8px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--portal-gold);
        }
        .card-body {
            color: var(--portal-text);
        }
        footer {
            background-color: var(--portal-navy);
            color: #FFFFFF;
            padding: 16px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>{% block header %}Default Header{% endblock %}</h1>
        {%block navbar%}
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}">Examination Portal</a>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                </ul>
            </div>
        </nav>
        {%endblock%}
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p class="text-center mb-0">&copy; 2026 Examination Management Portal</p>
    </footer>
</body>
</html>
