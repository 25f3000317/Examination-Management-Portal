{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
<h2>{{ 'Edit' if slot else 'Create' }} Examination Slot</h2>
<p>{{ exam.exam_name }}</p>
<form method="POST" class="card card-body">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3">
<label class="form-label">Date</label>
<input type="date" name="slot_date" class="form-control" required value="{{ slot.slot_date if slot else '' }}">
</div>
<div class="mb-3">
<label class="form-label">Start Time</label>
<input type="time" name="start_time" class="form-control" required value="{{ slot.start_time if slot else '' }}">
</div>
<div class="mb-3">
<label class="form-label">End Time</label>
<input type="time" name="end_time" class="form-control" required value="{{ slot.end_time if slot else '' }}">
</div>
<div class="mb-3">
<label class="form-label">Capacity</label>
<input type="number" name="capacity" min="1" class="form-control" required value="{{ slot.capacity if slot else 1 }}">
</div>
<button class="btn btn-primary">Save Slot</button>
<a href="{{ url_for('examiner_slots',exam_id=exam.exam_id) }}" class="btn btn-secondary mt-2">Cancel</a>
</form>
</div>
{% endblock %}
