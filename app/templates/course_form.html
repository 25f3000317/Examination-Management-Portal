{% extends "base.html" %}
{% block title %}{{ "Edit Course" if course else "Add Course" }} | Examination Portal{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-4"><h2>{{ "Edit Course" if course else "Add Course" }}</h2><a href="{{ url_for('manage_courses') }}" class="btn btn-outline-secondary">Back</a></div>
            <div class="card card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3"><label class="form-label">Course Name</label><input name="course_name" class="form-control" maxlength="150" required value="{{ course['course_name'] if course else '' }}"></div>
                    <div class="mb-3"><label class="form-label">Course Code</label><input name="course_code" class="form-control" maxlength="30" required value="{{ course['course_code'] if course else '' }}"></div>
                    <div class="mb-3"><label class="form-label">Department</label><input name="department" class="form-control" maxlength="100" required value="{{ course['department'] if course else '' }}"></div>
                    <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3">{{ course['description'] if course else '' }}</textarea></div>
                    <button class="btn btn-primary">{{ "Save Changes" if course else "Create Course" }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
